<!doctype html>
<html lang="zh-CN">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta charset="utf-8">
<title>端盘子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap">
<style>
/* 老字号酒楼的大堂：木墙、红灯笼、菜牌，正中是出菜口。外观固定，不跟系统深色走 */
:root{
  color-scheme:light;
  --ink:#3b2418;
  --soft:#7a5a46;
  --red:#d2412c;
  --gold:#f2b63c;
  --card:#fff8ec;
  --line:rgba(80,40,20,.16);
  --font-title:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --font-brush:"Ma Shan Zheng","KaiTi",serif;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-num:"Baloo 2","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{overflow:hidden;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;touch-action:none;-webkit-user-select:none;user-select:none;background:#4a2a1a}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}
#cv{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:0;top:0;width:420px;height:740px;transform-origin:0 0;pointer-events:none}
#hud > *{pointer-events:auto}
.bar{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:8px;pointer-events:none}
.bar > *{pointer-events:auto}
.chip{padding:4px 12px;border-radius:999px;background:rgba(255,248,236,.92);box-shadow:0 4px 10px rgba(0,0,0,.2);font-weight:700;font-size:14px;white-space:nowrap}
.chip b{font-family:var(--font-num);font-size:18px}
.hearts{font-size:18px;letter-spacing:1px}
.grow{flex:1}
.rbtn{width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,248,236,.92);box-shadow:0 4px 10px rgba(0,0,0,.2);font-size:15px;display:grid;place-items:center}
.rbtn.on{background:var(--gold)}
.order{position:absolute;left:50%;top:52px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(59,36,24,.82);color:#fff6e6;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none}
.order .slots{display:flex;gap:3px}
.order .slots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.22)}
.order .slots i.on{background:var(--gold)}
.route{position:absolute;left:50%;top:84px;width:170px;height:6px;transform:translateX(-50%);border-radius:3px;background:rgba(59,36,24,.55);overflow:hidden;pointer-events:none}
.route i{display:block;height:100%;width:0;background:var(--gold);border-radius:3px}
.big{position:absolute;left:50%;top:230px;transform:translate(-50%,-50%) scale(.7);opacity:0;transition:all .3s cubic-bezier(.2,.9,.3,1.4);pointer-events:none;text-align:center;white-space:nowrap}
.big.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.big b{display:block;font-family:var(--font-title);font-weight:400;font-size:42px;color:#fff;text-shadow:0 4px 0 rgba(120,40,20,.6),0 0 18px rgba(0,0,0,.3)}
.big span{display:inline-block;margin-top:2px;padding:2px 12px;border-radius:999px;background:rgba(59,36,24,.8);color:#fff6e6;font-size:14px;font-weight:700}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:6px 16px;border-radius:999px;background:rgba(59,36,24,.85);color:#fff6e6;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;transition:opacity .5s}

/* 首页、弹窗 */
#home,#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#home{background:radial-gradient(120% 80% at 50% 0%,#8a4a2a 0%,#5a2e1c 55%,#3a1c10 100%)}
#modal{background:rgba(40,18,8,.5)}
.card{width:min(370px,100%);max-height:calc(100% - 16px);overflow:auto;border-radius:24px;background:var(--card);box-shadow:0 24px 60px rgba(0,0,0,.4);padding:22px 20px 20px;display:flex;flex-direction:column;gap:12px;text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(14px) scale(.95);opacity:0}}
.logo{margin:0;font-family:var(--font-brush);font-weight:400;font-size:66px;line-height:1;color:var(--red);text-shadow:0 3px 0 #fff3dc}
.card h2{margin:0;font-family:var(--font-title);font-weight:400;font-size:30px}
.card p{margin:0}
.card .n{font-family:var(--font-num);font-weight:800;font-size:58px;line-height:1;color:var(--red)}
.card .small{font-size:12px;color:var(--soft)}
.card .dishes{font-size:24px;letter-spacing:2px;line-height:1.4;word-break:break-all}
.card ul{margin:0;padding:0 0 0 1.2em;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:14px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:900;font-size:17px;background:var(--red);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.16),0 8px 18px rgba(160,40,20,.3)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:active{transform:translateY(2px)}
.row{display:flex;gap:8px}
.row > *{flex:1}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="bar">
      <span class="chip hearts" id="hearts">❤️❤️❤️</span>
      <span class="grow"></span>
      <span class="chip">已上菜 <b id="served">0</b></span>
      <button class="rbtn" id="btnGyro" type="button" aria-label="体感操作" title="歪手机控制">📱</button>
      <button class="rbtn" id="btnPause" type="button" aria-label="暂停">❚❚</button>
    </div>
    <div class="order" id="order"><span id="orderT">第 1 桌</span><span class="slots" id="slots"></span></div>
    <div class="route" id="route" hidden><i id="routeBar"></i></div>
    <div class="big" id="big"><b></b><span></span></div>
    <div class="hint" id="hint">拖到想放的位置，松手放下</div>
  </div>
</div>

<section id="home">
  <div class="card">
    <h1 class="logo">端盘子</h1>
    <p>你是酒楼新来的跑堂，后厨不停往你托盘上放菜</p>
    <ul>
      <li>后厨出一道菜，拖到托盘上想放的位置，松手放下。放偏了托盘会往那边沉</li>
      <li>装好就出发：起步时菜往后滑，刹车时往前冲，手指往右托盘往前倾，往左往后仰</li>
      <li>托盘下面有水平仪，泡泡在中间菜就稳</li>
      <li>路上会有小朋友冲出来、台阶、湿地板。掉一道碎一个盘子，碎三个就下班</li>
    </ul>
    <button class="btn" id="btnStart" type="button">开工</button>
    <button class="btn ghost" id="btnBoard" type="button">🏆 今日排行榜</button>
    <p class="small" id="bestNote"></p>
  </div>
</section>
<div id="modal" hidden></div>

<!--BOARD 五个小游戏共用的每日排行榜（tools/board.html，用 tools/embed-board.mjs 塞进各个游戏）-->
<style>
.mb-wrap{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,25,20,.5);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#33302e;-webkit-user-select:none;user-select:none}
.mb-card{width:min(380px,100%);max-height:calc(100% - 16px);overflow:auto;border-radius:24px;background:#fffaf3;box-shadow:0 24px 60px rgba(40,20,10,.35);padding:22px 18px 18px;display:flex;flex-direction:column;gap:10px;text-align:center;animation:mb-pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes mb-pop{from{transform:translateY(14px) scale(.95);opacity:0}}
.mb-card h2{margin:0;font-family:"ZCOOL KuaiLe","PingFang SC",sans-serif;font-weight:400;font-size:28px;line-height:1.2}
.mb-sub{margin:0;font-size:12px;color:#7a716a}
.mb-tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:#f1e8dc;align-self:center}
.mb-tabs button{border:0;border-radius:999px;padding:6px 14px;background:transparent;font:inherit;font-weight:700;font-size:13px;color:#7a716a;cursor:pointer}
.mb-tabs button.on{background:#fff;color:#33302e;box-shadow:0 2px 6px rgba(60,30,10,.12)}
.mb-mine{margin:0;font-size:14px;font-weight:700;color:#3b9c80;min-height:1.4em}
.mb-list{display:flex;flex-direction:column;gap:6px;min-height:110px;max-height:50vh;overflow:auto;margin:0 -4px;padding:2px 4px;text-align:left}
.mb-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px rgba(60,40,30,.12)}
.mb-row.me{background:#e6f7f1;box-shadow:inset 0 0 0 2px #5fc7a8}
.mb-rk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:"Baloo 2","Noto Sans SC",sans-serif;font-weight:800;font-size:14px;color:#7a716a}
.mb-rk.g1{background:#ffd54f;color:#7a5200}.mb-rk.g2{background:#dfe3e8;color:#4a5560}.mb-rk.g3{background:#f1c39a;color:#7a3f12}
.mb-nm{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-sc{flex:none;max-width:52%;text-align:right;font-size:12px;color:#7a716a;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-sc b{display:block;font-family:"Baloo 2","Noto Sans SC",sans-serif;font-weight:800;font-size:15px;color:#33302e}
.mb-note{margin:0;padding:18px 0;text-align:center;font-size:13px;color:#7a716a}
.mb-row2{display:flex;gap:8px}
.mb-row2 > *{flex:1}
.mb-btn{border:0;border-radius:14px;padding:11px 10px;font:inherit;font-weight:900;font-size:15px;cursor:pointer;background:#fff;color:#33302e;box-shadow:inset 0 0 0 1.5px rgba(60,40,30,.14);-webkit-tap-highlight-color:transparent}
.mb-btn.main{background:#5fc7a8;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 8px 18px rgba(40,120,100,.3)}
.mb-btn:active{transform:translateY(2px)}
.mb-input{width:100%;box-sizing:border-box;border:0;border-radius:14px;padding:12px 14px;font:inherit;font-size:17px;font-weight:700;color:#33302e;background:#fff;box-shadow:inset 0 0 0 2px rgba(60,40,30,.14);outline:none;-webkit-user-select:text;user-select:text}
.mb-input:focus{box-shadow:inset 0 0 0 2px #5fc7a8}
.mb-err{min-height:1.2em;margin:0;font-size:12px;color:#ff7a6b}
</style>
<script>
window.MiniBoard = (() => {
'use strict';
// Supabase 项目的地址和公开 key（公开 key 本来就是给网页用的，能读榜、能交成绩，改不了别人的）
const URL0 = 'https://ghjrmmqnajguwkfoplgo.supabase.co', KEY = 'sb_publishable_1YWUN4fZ3c_TjQD9p6Lmlg_K-vDB6y_';
const PREVIEW = !!window.claude || /(^|\.)claude(usercontent)?\.(ai|com)$/.test(location.hostname);
const store = {
  get(k, d){ try { const v = localStorage.getItem('mini:' + k); return v == null ? d : JSON.parse(v); } catch (e){ return d; } },
  set(k, v){ try { localStorage.setItem('mini:' + k, JSON.stringify(v)); } catch (e){} }
};
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
// game：哪个游戏；first：一天只算第一局（否则留当天最好的一局）
let cfg = {game: '', first: false};
const day = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
// 每个人一个只存在自己手机上的编号（交成绩、改名用），和一个公开的短标记（榜上认出自己用）；五个游戏共用一个名字
function me(){
  let m = store.get('me', null);
  if (!m){
    const hex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');
    const h = hex(16);
    m = {pid: `${h.slice(0, 8)}-${h.slice(8, 12)}-4${h.slice(13, 16)}-a${h.slice(17, 20)}-${h.slice(20, 32)}`, tag: hex(4), name: ''};
    store.set('me', m);
  }
  return m;
}
let api = async (path, body) => {
  const headers = {apikey: KEY, 'Content-Type': 'application/json'};
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(URL0 + '/rest/v1/' + path, body ? {method: 'POST', headers, body: JSON.stringify(body), signal: ctl.signal} : {headers, signal: ctl.signal});
    if (!r.ok) throw new Error('http ' + r.status);
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  } finally {
    clearTimeout(timer);
  }
};
const pendKey = board => `pend:${cfg.game}:${board}`, sentKey = board => `sent:${cfg.game}:${board}`;
const better = (x, y) => x.a > y.a || (x.a === y.a && (x.b || 0) > (y.b || 0));
// 交成绩：a 越大越好，a 一样比 b；shown 是榜上显示的成绩，extra 是下面一行小字
function submit(board, sc){
  const d = day(), p = store.get(pendKey(board), null), sent = store.get(sentKey(board), null);
  if (cfg.first && ((sent && sent.day === d) || (p && p.day === d))) return;
  if (p && p.day === d && !better(sc, p)) return;
  if (sent && sent.day === d && !better(sc, sent)) return;
  store.set(pendKey(board), {day: d, a: sc.a, b: sc.b || 0, shown: String(sc.shown).slice(0, 40), extra: String(sc.extra || '').slice(0, 60)});
  flush(board).catch(() => {});
}
async function flush(board){
  const p = store.get(pendKey(board), null), m = me();
  if (!p || !m.name || PREVIEW) return null;
  const res = await api('rpc/mini_submit', {p_game: cfg.game, p_board: board, p_day: p.day, p_player: m.pid, p_tag: m.tag, p_name: m.name, p_a: p.a, p_b: p.b, p_shown: p.shown, p_extra: p.extra});
  store.set(pendKey(board), null);
  store.set(sentKey(board), {day: p.day, a: p.a, b: p.b});
  return res;
}
const open = card => { close(); const w = el('div', 'mb-wrap'); w.id = 'mbWrap'; w.appendChild(card); w.addEventListener('click', e => { if (e.target === w) close(); }); document.body.appendChild(w); };
const close = () => { const w = document.getElementById('mbWrap'); if (w) w.remove(); };
// 打开今天的排行榜。o: {title, sub, empty, tabs: [{id, label}]}（有好几张榜的时候上面放一排切换）
async function show(board = '', o = {}){
  const card = el('div', 'mb-card');
  const mine = el('p', 'mb-mine'), list = el('div', 'mb-list');
  card.append(el('h2', '', o.title || '今天的排行榜'), el('p', 'mb-sub', o.sub || ''));
  if (o.tabs){
    const tabs = el('div', 'mb-tabs');
    for (const t of o.tabs){
      const b = el('button', t.id === board ? 'on' : '', t.label);
      b.type = 'button';
      b.addEventListener('click', () => { if (t.id !== board) show(t.id, o); });
      tabs.appendChild(b);
    }
    card.appendChild(tabs);
  }
  card.append(mine, list);
  list.appendChild(el('p', 'mb-note', '正在打开排行榜…'));
  const row = el('div', 'mb-row2');
  const nm = el('button', 'mb-btn', me().name ? '改名字' : '起个名字');
  nm.type = 'button';
  nm.addEventListener('click', () => askName(() => show(board, o)));
  const cl = el('button', 'mb-btn main', '关闭');
  cl.type = 'button';
  cl.addEventListener('click', close);
  row.append(nm, cl);
  card.appendChild(row);
  open(card);
  if (PREVIEW){ list.replaceChildren(el('p', 'mb-note', '预览里连不上排行榜，到网页版看')); return; }
  let res = null;
  try { res = await flush(board); } catch (e){}
  let rows;
  try { rows = await api(`mini_scores?select=tag,name,a,b,shown,extra&game=eq.${cfg.game}&board=eq.${encodeURIComponent(board)}&day=eq.${day()}&order=a.desc,b.desc,updated_at.asc&limit=100`); } catch (e){ if (list.isConnected) list.replaceChildren(el('p', 'mb-note', '排行榜没连上，过一会儿再试')); return; }
  if (!list.isConnected) return;
  const m = me();
  list.replaceChildren();
  if (!rows.length) list.appendChild(el('p', 'mb-note', '今天还没有人上榜，来当第一个'));
  let myRank = 0;
  rows.forEach((r, k) => {
    const isMe = r.tag === m.tag;
    if (isMe) myRank = k + 1;
    const d = el('div', 'mb-row' + (isMe ? ' me' : ''));
    const sc = el('span', 'mb-sc');
    sc.append(el('b', '', r.shown), document.createTextNode(r.extra || ''));
    d.append(el('span', 'mb-rk' + (k < 3 ? ' g' + (k + 1) : ''), String(k + 1)), el('span', 'mb-nm', r.name + (isMe ? '（我）' : '')), sc);
    list.appendChild(d);
  });
  const p = store.get(pendKey(board), null);
  if (myRank) mine.textContent = `你排第 ${myRank} 名，一共 ${rows.length}${rows.length >= 100 ? '+' : ''} 人`;
  else if (res && res.rank) mine.textContent = `你排第 ${res.rank} 名，一共 ${res.total} 人`;
  else if (p && p.day === day()) mine.textContent = m.name ? '成绩还没交上去，过一会儿再打开试试' : '起个名字，今天的成绩就能上榜';
  else if ((store.get(sentKey(board), null) || {}).day === day()) mine.textContent = '你在 100 名以外';
  else mine.textContent = o.empty || '玩一局就能上榜';
  if (myRank) setTimeout(() => list.children[myRank - 1]?.scrollIntoView({block: 'nearest'}), 50);
}
function askName(then){
  const card = el('div', 'mb-card');
  const m = me();
  card.append(el('h2', '', m.name ? '改个名字' : '起个名字上榜'), el('p', 'mb-sub', '排行榜上显示这个名字，最多 12 个字，几个小游戏共用'));
  const input = el('input', 'mb-input');
  input.type = 'text';
  input.maxLength = 12;
  input.placeholder = '比如：小游戏大王';
  input.value = m.name || '';
  input.autocomplete = 'nickname';
  input.enterKeyHint = 'done';
  input.setAttribute('aria-label', '昵称');
  const err = el('p', 'mb-err');
  err.setAttribute('role', 'alert');
  card.append(input, err);
  const ok = () => {
    const name = input.value.trim().slice(0, 12);
    if (!name){ err.textContent = '先起个名字'; input.focus(); return; }
    const renamed = m.name && m.name !== name;
    store.set('me', Object.assign(me(), {name}));
    if (renamed && !PREVIEW) api('rpc/mini_rename', {p_player: m.pid, p_name: name}).catch(() => {});
    then();
  };
  // 回车只算一次：不拦住的话，这一下还会按到下一个弹窗里的按钮
  input.addEventListener('keydown', e => { e.stopPropagation(); if (e.key !== 'Enter' || e.isComposing) return; e.preventDefault(); ok(); });
  const row = el('div', 'mb-row2');
  const skip = el('button', 'mb-btn', m.name ? '不改了' : '先不上榜');
  skip.type = 'button';
  skip.addEventListener('click', m.name ? then : close);
  const go = el('button', 'mb-btn main', '好了');
  go.type = 'button';
  go.addEventListener('click', ok);
  row.append(skip, go);
  card.appendChild(row);
  open(card);
  // 改名的时候旧名字整个选中，直接打字就替换掉
  setTimeout(() => { input.focus(); input.select(); }, 60);
}
const api0 = {init(o){ cfg = Object.assign({first: false}, o); }, submit, show, close, hasName: () => !!me().name};
if (['localhost', '127.0.0.1'].includes(location.hostname)) api0.mock = fn => { api = fn; };
return api0;
})();
</script>

<script>
(async () => {
'use strict';
MiniBoard.init({game: 'duanpanzi'});
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const TAU = Math.PI * 2;

/* ================= 托盘上的菜：自己算的物理 ================= */
// 菜并排放在托盘上（不摞），只会沿着托盘滑：静摩擦扛得住就不动，扛不住就滑，动摩擦慢慢拖住；菜和菜会互相推；
// 撞到托盘边：慢的停住，快的翻出去。西瓜会滚（摩擦很小）；高的酒坛、筷子筒歪得太厉害会倒
const GRAV = 1000, LIP = TRAY_W / 2 - 6, OVER = 50;
const FRICTION = {melon: [.1, .05]};
const TALL = new Set(['jar', 'chop']);
// 一道菜的半宽、半高
function dishSize(type){
  const d = DISHES[type];
  if (d.circle) return {w: d.circle, h: d.circle};
  if (d.rect) return {w: d.rect[0] / 2, h: d.rect[1] / 2};
  const xs = d.verts.map(v => v[0]), ys = d.verts.map(v => v[1]);
  return {w: (Math.max(...xs) - Math.min(...xs)) / 2, h: (Math.max(...ys) - Math.min(...ys)) / 2};
}
const INFO = {};
function dishInfo(type){
  if (INFO[type]) return INFO[type];
  const d = DISHES[type], s = dishSize(type);
  let c = {x: 0, y: 0};
  if (d.verts){ const xs = d.verts.map(v => v[0]), ys = d.verts.map(v => v[1]); c = {x: (Math.max(...xs) + Math.min(...xs)) / 2, y: (Math.max(...ys) + Math.min(...ys)) / 2}; }
  const [ms, mk] = FRICTION[type] || [.38, .3];
  return (INFO[type] = {w: s.w, h: s.h, c, ms, mk, m: s.w * s.h * 4 * d.density, tall: TALL.has(type)});
}
let G = null;
const trayPose = () => ({x: G.X + TRAY_OFF, y: TRAY_Y + G.dy, a: G.ang});
// 托盘坐标（沿托盘 u、垂直托盘 v，向上为负）→ 世界坐标
function trayToWorld(u, v){ const p = trayPose(), c = Math.cos(p.a), s = Math.sin(p.a); return {x: p.x + u * c - v * s, y: p.y + u * s + v * c}; }
// 托盘上的菜压偏了：重心偏哪边，托盘就往哪边沉
function loadTorque(){ let s = 0; for (const d of G.dishes) s += d.f.m * d.u / LIP; return s; }
const sagNow = () => (G.phase === 'load' ? 0 : clamp(loadTorque() * .03, -.15, .15) * G.sagIn);
// 水平仪：托盘歪的角度和「走路的加速度要你歪的角度」差多少；差 0 菜就不会滑
const levelErr = () => G.ang - Math.atan((G.phase === 'walk' ? G.a : 0) / GRAV);
function dishStep(){
  const th = G.ang, ax = G.phase === 'walk' ? G.a : 0, gy = GRAV - G.ay;
  const gt = -ax * Math.cos(th) + gy * Math.sin(th), gn = Math.max(0, ax * Math.sin(th) + gy * Math.cos(th));
  for (const d of [...G.dishes]){
    const f = d.f;
    if (Math.abs(d.v) < 3 && Math.abs(gt) <= f.ms * gn) d.v = 0;
    else {
      const nv = d.v + (gt - f.mk * gn * Math.sign(d.v || gt)) * STEP;
      d.v = d.v !== 0 && Math.sign(nv) !== Math.sign(d.v) && Math.abs(gt) <= f.ms * gn ? 0 : nv;
    }
    if (d.type === 'melon') d.rot += d.v * STEP / f.h;
    // 高的东西：歪的比例快到它站得住的极限就开始晃，超过了一会儿就倒
    if (f.tall){
      const r = Math.abs(gt) / Math.max(1, gn), lim = f.w / f.h;
      d.wob += ((r > lim * .6 ? Math.sign(gt) * Math.min(.5, (r - lim * .6) * 1.4) : 0) - d.wob) * .2;
      d.tip = r > lim ? d.tip + STEP : Math.max(0, d.tip - STEP);
      if (d.tip > .25){ fall(d, 'tip'); continue; }
    }
    d.u += d.v * STEP;
  }
  // 菜和菜挤在一起：推开，一起走
  G.dishes.sort((a, b) => a.u - b.u);
  for (let k = 0; k < 3; k++) for (let i = 0; i + 1 < G.dishes.length; i++){
    const a = G.dishes[i], b = G.dishes[i + 1], gap = (b.u - b.f.w) - (a.u + a.f.w);
    if (gap >= 0) continue;
    const tm = a.f.m + b.f.m;
    a.u += gap * b.f.m / tm; b.u -= gap * a.f.m / tm;
    if (a.v > b.v){ if (a.v - b.v > 40) Sound.clink(Math.min(1, (a.v - b.v) / 200)); const v = (a.f.m * a.v + b.f.m * b.v) / tm; a.v = b.v = v; }
  }
  // 托盘边
  for (const d of [...G.dishes]){
    const lim = d.f.tall ? OVER * .6 : OVER;
    if (d.u + d.f.w > LIP){ if (d.v > lim) fall(d, 'over'); else { if (d.v > 30) Sound.clink(.4); d.u = LIP - d.f.w; d.v = Math.min(0, d.v); } }
    else if (d.u - d.f.w < -LIP){ if (-d.v > lim) fall(d, 'over'); else { if (-d.v > 30) Sound.clink(.4); d.u = -LIP + d.f.w; d.v = Math.max(0, d.v); } }
  }
}
// 一道菜离开托盘：变成往下掉的
function fall(d, why){
  G.dishes.splice(G.dishes.indexOf(d), 1);
  const p = trayToWorld(d.u, -(d.f.h + 6)), c = Math.cos(G.ang), s = Math.sin(G.ang);
  G.falling.push({type: d.type, f: d.f, x: p.x, y: p.y, vx: (G.phase === 'walk' ? G.v : 0) + d.v * c, vy: d.v * s - (why === 'tip' ? 0 : 40), a: G.ang + d.wob, va: (d.v >= 0 ? 1 : -1) * (why === 'tip' ? 5 : 3)});
  Sound.whoa();
}

/* ================= 一局 ================= */
// 一桌：先在出菜口装盘（拖到想放的位置，松手放下），再端着走到桌前。走起来菜会往后滑，刹车会往前冲
const STEP = 1 / 60;
function start(){
  G = {t: 0, hearts: 3, served: 0, table: 1, X: 0, v: 0, a: 0, ay: 0, dy: 0, dyV: 0, ang: 0, target: 0, aimX: TRAY_OFF, sagIn: 0, wait: 0, slip: 0, fade: 0, fadeDir: 0, next: 0, dishes: [], falling: [], shards: [], fx: [], kept: [], delivering: [], face: 'happy', sweat: 0, over: false, paused: false};
  $('home').hidden = true;
  closeModal();
  newTable();
  Sound.unlock();
}
function newTable(){
  const n = G.table;
  G.dishes = []; G.falling = []; G.delivering = [];
  // 这桌的菜：数量随桌数加，但要放得下（不能摞），还要留点空当
  const want = Math.min(5, 2 + Math.ceil(n / 2));
  G.order = [];
  let room = LIP * 2 * .78;
  for (let k = 0; k < want; k++){
    let t, tries = 0;
    do t = pickDish(); while (dishInfo(t).w * 2 + 6 > room && ++tries < 30);
    if (dishInfo(t).w * 2 + 6 > room) break;
    G.order.push(t); room -= dishInfo(t).w * 2 + 6;
  }
  G.need = G.order.length;
  G.placed = 0; G.hold = null; G.nextHold = G.t + .8; G.goAt = 0;
  G.phase = 'load'; G.X = 0; G.v = 0; G.a = 0; G.ay = 0; G.dy = 0; G.dyV = 0; G.ang = 0; G.sagIn = 0; G.wait = 0; G.slip = 0; G.target = 0;
  G.route = makeRoute(n);
  big(`第 ${n} 桌`, `要 ${G.need} 道菜 · 先装盘`);
  $('hint').textContent = '拖到想放的位置，松手放下';
  $('hint').style.opacity = n <= 2 ? 1 : 0;
  hud();
}
// 一条路：多远、走多快、路上有什么。acc 起步、brake 急刹的加速度（像素/秒²，重力是 1000）：平托盘只扛得住 380，歪对了能扛 1000 以上
function makeRoute(n){
  const R = {D: Math.min(1500, 520 + n * 110), vmax: Math.min(340, 200 + n * 14), acc: Math.min(720, 420 + n * 28), brake: Math.min(840, 500 + n * 32), events: [], tables: []};
  const kinds = ['kid'];
  if (n >= 3) kinds.push('step');
  if (n >= 4) kinds.push('wet');
  const count = n < 2 ? 0 : Math.min(5, Math.floor(n / 1.6));
  let x = 240 + Math.random() * 80;
  while (R.events.length < count && x < R.D - 240){ R.events.push({kind: kinds[Math.floor(Math.random() * kinds.length)], x, done: false, t0: 0}); x += 220 + Math.random() * 170; }
  for (let tx = 320 + Math.random() * 80; tx < R.D - 260; tx += 300 + Math.random() * 120) R.tables.push(tx);
  return R;
}
function pickDish(){
  const pool = POOL.filter(([id]) => !(G.table < 3 && (id === 'melon' || id === 'chop' || id === 'jar')));
  const tot = pool.reduce((a, [, w]) => a + w, 0);
  let r = Math.random() * tot;
  for (const [id, w] of pool){ if ((r -= w) < 0) return id; }
  return pool[0][0];
}
// 手上的菜要放在哪：不能叠，挪到离手指最近、放得下的空当
function holdPos(){
  const f = dishInfo(G.hold.type), u = clamp(G.aimX - TRAY_OFF, -LIP + f.w, LIP - f.w);
  const occ = G.dishes.map(d => [d.u - d.f.w - 2, d.u + d.f.w + 2]).sort((a, b) => a[0] - b[0]);
  const free = []; let s0 = -LIP;
  for (const [a, b] of occ){ if (a > s0) free.push([s0, a]); s0 = Math.max(s0, b); }
  if (LIP > s0) free.push([s0, LIP]);
  let best = null;
  for (const [a, b] of free){ if (b - a < f.w * 2) continue; const uu = clamp(u, a + f.w, b - f.w); if (best == null || Math.abs(uu - u) < Math.abs(best - u)) best = uu; }
  return {u: best ?? u, f};
}
function placeHold(){
  if (!G.hold) return;
  const p = holdPos();
  G.dishes.push({type: G.hold.type, f: p.f, u: p.u, v: 0, wob: 0, tip: 0, rot: 0});
  G.hold = null; G.placed++; G.nextHold = G.t + .3;
  Sound.place();
  hud();
}
function loadStep(){
  if (!G.hold && G.placed < G.need && G.t >= G.nextHold){ G.hold = {type: G.order[G.placed], t0: G.t}; Sound.ding(); }
  if (G.hold && G.t - G.hold.t0 > 6) placeHold();
  if (G.placed >= G.need && !G.hold){
    if (!G.goAt) G.goAt = G.t + .8;
    if (G.t >= G.goAt){
      G.phase = 'walk';
      big('出发！', `送到第 ${G.table} 桌`);
      Sound.go();
      $('hint').textContent = '起步手指往右，刹车往左 · 看托盘下的水平仪';
      $('hint').style.opacity = G.table <= 2 ? 1 : 0;
    }
  }
}
const JERK = 2600;   // 加速度每秒最多变多少，太突然人也接不住
function walkStep(){
  const R = G.route;
  G.sagIn = Math.min(1, G.sagIn + STEP / .8);
  const kid = R.events.find(e => e.kind === 'kid' && !e.done);
  // 小朋友：在刚好来得及刹住的地方冲出来
  if (kid && !kid.t0 && kid.x - 70 - G.X < G.v * G.v / (2 * R.brake) + G.v * .22 + 20){ kid.t0 = G.t; Sound.hey(); }
  const stopAt = kid && kid.t0 ? kid.x - 70 : R.D;
  if (G.wait > 0){
    G.wait -= STEP; G.v = 0; G.a = 0;
    if (G.wait <= 0 && kid) kid.done = true;
  } else {
    const dist = stopAt - G.X;
    if (G.v < 5 && dist < 24){
      G.v = 0; G.a = 0;
      if (kid && kid.t0) G.wait = .8; else { arrive(); return; }
    } else {
      // 平时到桌前慢慢停；小朋友冲出来就得急刹
      const brake = kid && kid.t0 ? R.brake : R.brake * .75;
      const vt = dist > 0 ? Math.min(R.vmax, Math.sqrt(2 * brake * dist)) : 0;
      let want = clamp((vt - G.v) * 6, -R.brake, R.acc), jerk = JERK;
      // 湿地板：脚下一滑，猛地一顿（很急，但看到牌子提前往后仰就接得住）
      if (G.slip > 0){ G.slip -= STEP; want = -650; jerk = 9000; }
      G.a += clamp(want - G.a, -jerk * STEP, jerk * STEP);
      G.v = Math.max(0, G.v + G.a * STEP);
      G.X += G.v * STEP;
    }
  }
  for (const e of R.events) if (e.kind === 'wet' && !e.done && G.X >= e.x){ e.done = true; G.slip = .22; Sound.slip(); }
  // 台阶：上去、下来各颠一下
  const up = R.events.some(e => e.kind === 'step' && G.X >= e.x && G.X <= e.x + 150) ? -12 : 0;
  const v0 = G.dyV;
  G.dyV += clamp(clamp((up - G.dy) * .3, -1.4, 1.4) - G.dyV, -.25, .25);
  G.dy += G.dyV;
  G.ay = (G.dyV - v0) * 3600;
}
// 托盘角度：往手指要的方向转（菜压偏了会往那边沉）
function turnTray(){
  const tgt = (G.phase === 'walk' ? G.target : 0) + sagNow();
  G.ang = clamp(G.ang + clamp((tgt - G.ang) * .2, -.045, .045), -.6, .6);
}
function step(){
  G.t += STEP;
  if (G.phase === 'load') loadStep();
  else if (G.phase === 'walk') walkStep();
  else if (G.phase === 'serve' && G.t >= G.next && !G.fadeDir) G.fadeDir = 1;
  if (G.phase !== 'walk') G.ay = 0;
  turnTray();
  if (G.phase !== 'serve') dishStep();
  // 往下掉的菜
  for (const f of [...G.falling]){
    f.vy += GRAV * STEP; f.x += f.vx * STEP; f.y += f.vy * STEP; f.a += f.va * STEP; f.vx *= .995;
    if (f.y + f.f.h > FLOOR){ G.falling.splice(G.falling.indexOf(f), 1); crash(f); }
  }
  G.onTray = G.dishes.length;
  const edge = G.dishes.some(d => Math.abs(d.u) + d.f.w > LIP - 4 && d.v !== 0) || G.dishes.some(d => Math.abs(d.wob) > .15);
  G.sweat = edge ? Math.min(1, G.sweat + STEP * 3) : Math.max(0, G.sweat - STEP * 2);
  // 换桌：屏幕暗一下，回到出菜口
  if (G.fadeDir){
    G.fade += G.fadeDir * STEP / .35;
    if (G.fadeDir > 0 && G.fade >= 1){ G.fade = 1; G.fadeDir = -1; if (G.hearts > 0){ G.table++; newTable(); } }
    else if (G.fadeDir < 0 && G.fade <= 0){ G.fade = 0; G.fadeDir = 0; }
  }
  G.face = G.hearts <= 0 ? 'dizzy' : G.sweat > .4 || Math.abs(levelErr()) > .14 ? 'worried' : G.phase === 'serve' ? 'proud' : 'happy';
}
function crash(f){
  G.hearts--;
  for (let k = 0; k < 16; k++) G.shards.push({x: f.x, y: FLOOR, vx: (Math.random() - .5) * 260, vy: -80 - Math.random() * 200, r: Math.random() * TAU, vr: (Math.random() - .5) * 14, life: 1.2, s: 3 + Math.random() * 5, c: Math.random() < .5 ? '#ffffff' : '#9fb6d8'});

  big('啪！', `${DISHES[f.type].name}摔了`);
  hud();

}
// 到桌了：托盘上的菜一道道端上桌
function arrive(){
  G.phase = 'serve';

  list.forEach((d, i) => {
    const p = trayToWorld(d.u, -(d.f.h + 6));
    const x1 = tx - 62 + (list.length > 1 ? i * 124 / (list.length - 1) : 62);
    G.delivering.push({type: d.type, f: d.f, t0: G.t + i * .07, x0: p.x, y0: p.y, a0: G.ang, x1, y1: TABLE_TOP - d.f.h * .9});
    G.kept.push(DISHES[d.type].emoji);
  });
  G.dishes = [];
  G.served += list.length;
  for (let k = 0; k < 40; k++) G.fx.push({x: tx + (Math.random() - .5) * 200, y: TRAY_Y - 40 - Math.random() * 80, vx: (Math.random() - .5) * 200, vy: -100 - Math.random() * 160, life: 1.2, c: ['#f2b63c', '#d2412c', '#ffffff', '#3fae8c'][k % 4], r: Math.random() * TAU});
  Sound.served();

  G.next = G.t + 1.8;

}
function gameOver(){

  G.over = true;
  Sound.over();
  const best = store.get('best', 0), isNew = G.served > best;
  if (isNew) store.set('best', G.served);

  c.fillStyle = 'rgba(0,0,0,.22)'; c.beginPath(); c.roundRect(-TRAY_W / 2 + 4, 4, TRAY_W - 8, 10, 5); c.fill();
  const g = c.createLinearGradient(0, -6, 0, 6); g.addColorStop(0, '#d8913f'); g.addColorStop(1, '#8a4a1a');
  c.fillStyle = g; c.beginPath(); c.roundRect(-TRAY_W / 2, -6, TRAY_W, 12, 5); c.fill();
  c.fillStyle = 'rgba(255,230,190,.45)'; c.fillRect(-TRAY_W / 2 + 6, -5, TRAY_W - 12, 2);
  c.fillStyle = '#7a3c12'; c.beginPath(); c.roundRect(-TRAY_W / 2, -12, 6, 10, 2); c.fill(); c.beginPath(); c.roundRect(TRAY_W / 2 - 6, -12, 6, 10, 2); c.fill();
  // 水平仪：泡泡在中间菜就不会滑
  if (G && G.phase !== 'load'){
    const e = levelErr(), bx = clamp(-e * 140, -30, 30), col = Math.abs(e) < .05 ? '#7ee08a' : Math.abs(e) < .12 ? '#ffd23f' : '#ff6b5a';
    c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.roundRect(-40, 10, 80, 13, 6.5); c.fill();
    c.strokeStyle = 'rgba(60,30,10,.4)'; c.lineWidth = 1; c.beginPath(); c.moveTo(-7, 11); c.lineTo(-7, 22); c.moveTo(7, 11); c.lineTo(7, 22); c.stroke();
    c.fillStyle = col; c.beginPath(); c.ellipse(bx, 16.5, 8, 4.5, 0, 0, TAU); c.fill();
  }

}
function drawDishAt(c, type, off, x, y, a, alpha = 1, scale = 1){
  c.save(); c.globalAlpha = alpha; c.translate(x, y); c.rotate(a); c.scale(scale, scale); c.translate(-off.x, -off.y);
  DISHES[type].art(c);
  c.restore();
}
function draw(now){
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  if (bg) c.drawImage(bg, 0, 0);
  c.setTransform(S, 0, 0, S, 0, 0);
  const t = now / 1000, cam = G ? G.X : 0;
  drawScene(c, cam, t);
  if (!G) return;
  c.save(); c.translate(-cam, 0);
  // 上了桌的菜
  for (const d of G.delivering){
    const u = clamp((G.t - d.t0) / .55, 0, 1), e = u * u * (3 - 2 * u);
    drawDishAt(c, d.type, d.f.c, d.x0 + (d.x1 - d.x0) * e, d.y0 + (d.y1 - d.y0) * e - Math.sin(u * Math.PI) * 50, d.a0 * (1 - e), 1, 1 - e * .25);
  }
  drawWaiter(c, G.X + WAITER_OFF, t);
  drawTray(c);
  for (const d of G.dishes){ const p = trayToWorld(d.u, -(d.f.h + 6)); drawDishAt(c, d.type, d.f.c, p.x, p.y, G.ang + d.wob + d.rot); }
  for (const f of G.falling) drawDishAt(c, f.type, f.f.c, f.x, f.y, f.a);
  // 手上拿着、还没放下的菜
  if (G.hold){
    const p = holdPos(), age = G.t - G.hold.t0, at = trayToWorld(p.u, -(p.f.h + 6));
    c.save(); c.setLineDash([4, 6]); c.strokeStyle = 'rgba(255,240,200,.55)'; c.lineWidth = 2; c.beginPath(); c.moveTo(at.x, at.y - 50); c.lineTo(at.x, at.y); c.stroke(); c.restore();
    c.save(); c.globalAlpha = .25; c.fillStyle = '#fff'; c.beginPath(); c.ellipse(at.x, at.y + p.f.h, p.f.w, 4, 0, 0, TAU); c.fill(); c.restore();
    drawDishAt(c, G.hold.type, p.f.c, at.x, at.y - 56 + Math.sin(t * 5) * 2, 0, .92);
    if (age > 3){ const u = (age - 3) / 3; c.strokeStyle = '#f2b63c'; c.lineWidth = 3; c.beginPath(); c.arc(at.x, at.y - 100 - p.f.h, 9, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - u)); c.stroke(); }
  }
  if (G.route) for (const e of G.route.events) if (e.kind === 'kid' && (!e.done || G.t - e.t0 < 3)) drawKid(c, e, t);
  for (const s of G.shards){ c.save(); c.globalAlpha = Math.min(1, s.life * 2); c.translate(s.x, s.y); c.rotate(s.r); c.fillStyle = s.c; c.beginPath(); c.moveTo(-s.s, 0); c.lineTo(0, -s.s * .6); c.lineTo(s.s, s.s * .4); c.closePath(); c.fill(); c.restore(); }

  c.restore();
  if (G.fade > 0){ c.fillStyle = `rgba(30,14,6,${G.fade})`; c.fillRect(0, 0, W, H); }
}
function updateFx(dt){
  if (!G) return;
  for (let k = G.shards.length - 1; k >= 0; k--){ const s = G.shards[k]; s.life -= dt; s.vy += 600 * dt; s.x += s.vx * dt; s.y = Math.min(FLOOR + 6, s.y + s.vy * dt); s.r += s.vr * dt; if (s.y >= FLOOR + 6){ s.vy *= -.3; s.vx *= .7; } if (s.life <= 0) G.shards.splice(k, 1); }
  for (let k = G.fx.length - 1; k >= 0; k--){ const f = G.fx[k]; f.life -= dt; f.vy += 300 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.r += dt * 8; if (f.life <= 0) G.fx.splice(k, 1); }
}
let last = performance.now(), acc = 0, hudT = 0;
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (G && !G.over && !G.paused){ acc += dt; let n = 0; while (acc >= STEP && n < 4){ step(); acc -= STEP; n++; } if (n === 4) acc = 0; }
  updateFx(dt);
  draw(now);
  if (now - hudT > 120){ hudT = now; if (G) hudLite(); }
  requestAnimationFrame(loop);
}

/* ================= 界面 ================= */
function hud(){
  $('hearts').textContent = '❤️'.repeat(Math.max(0, G.hearts)) + '🤍'.repeat(3 - Math.max(0, G.hearts));
  $('served').textContent = G.served;
  hudLite();
}
function hudLite(){
  const load = G.phase === 'load';
  $('orderT').textContent = load ? `第 ${G.table} 桌 · 装盘 ${G.placed}/${G.need}` : `第 ${G.table} 桌 · 托盘上 ${G.onTray}/${G.need}`;
  const s = $('slots');
  if (s.children.length !== G.need){ s.replaceChildren(); for (let k = 0; k < G.need; k++) s.appendChild(el('i')); }
  [...s.children].forEach((i, k) => i.classList.toggle('on', k < (load ? G.placed : G.onTray)));
  $('route').hidden = load;
  $('routeBar').style.width = (G.route ? clamp(G.X / G.route.D, 0, 1) * 100 : 0) + '%';
}
let bigT = 0;
function big(a, b){ const e = $('big'); e.querySelector('b').textContent = a; e.querySelector('span').textContent = b; e.classList.add('show'); clearTimeout(bigT); bigT = setTimeout(() => e.classList.remove('show'), 1300); }
function openModal(card){ const m = $('modal'); m.replaceChildren(card); m.hidden = false; }
function closeModal(){ $('modal').hidden = true; }
function copy(t){
  const fb = () => { const ta = el('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e){} ta.remove(); };
  try { navigator.clipboard.writeText(t).catch(fb); } catch (e){ fb(); }
}
function pause(){
  if (!G || G.over) return;
  G.paused = true;
  const card = el('div', 'card');
  card.append(el('h2', '', '歇一会儿'), el('p', 'small', `已上菜 ${G.served} 道 · 第 ${G.table} 桌`));
  const row = el('div', 'row');
  const go = el('button', 'btn', '接着端'); go.type = 'button'; go.addEventListener('click', () => { closeModal(); G.paused = false; last = performance.now(); });
  const snd = el('button', 'btn ghost', Sound.on ? '🔊 声音开' : '🔇 声音关'); snd.type = 'button'; snd.addEventListener('click', () => { Sound.set(!Sound.on); snd.textContent = Sound.on ? '🔊 声音开' : '🔇 声音关'; });
  row.append(go, snd);
  const re = el('button', 'btn ghost', '重新开工'); re.type = 'button'; re.addEventListener('click', start);
  card.append(row, re);
  openModal(card);
}
$('btnPause').addEventListener('click', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ================= 操作 ================= */
// 装盘的时候：手指左右挪选位置，松手放下。走路的时候：手指在屏幕左右的位置决定托盘歪多少，松手就停在那里
let touching = false, gyro = false;
const worldX = e => { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W + (G ? G.X : 0); };
function aimFrom(e){ const r = cv.getBoundingClientRect(); const u = (e.clientX - r.left) / r.width; G.target = clamp((u - .5) * 1.3, -.5, .5); }
const live = () => G && !G.over && !G.paused;
cv.addEventListener('pointerdown', e => {
  if (!live()) return;
  Sound.unlock(); touching = true; cv.setPointerCapture(e.pointerId);
  if (G.phase === 'load') G.aimX = worldX(e); else if (!gyro) aimFrom(e);
});
cv.addEventListener('pointermove', e => {
  if (!live() || !(touching || e.pointerType === 'mouse')) return;
  if (G.phase === 'load') G.aimX = worldX(e); else if (!gyro) aimFrom(e);
});
cv.addEventListener('pointerup', () => { touching = false; if (live() && G.phase === 'load' && G.hold) placeHold(); });
cv.addEventListener('pointercancel', () => { touching = false; });
addEventListener('keydown', e => {
  if (!live()) return;
  if (G.phase === 'load'){
    if (e.key === 'ArrowLeft') G.aimX -= 14;
    if (e.key === 'ArrowRight') G.aimX += 14;
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown'){ e.preventDefault(); placeHold(); }
  } else {
    if (e.key === 'ArrowLeft') G.target = clamp(G.target - .06, -.5, .5);
    if (e.key === 'ArrowRight') G.target = clamp(G.target + .06, -.5, .5);
  }
  if (e.key === 'Escape') pause();
});
// 歪手机控制（走路的时候）
function onTilt(e){ if (!G || !gyro || e.gamma == null || G.phase !== 'walk') return; G.target = clamp(e.gamma / 40 * .5, -.5, .5); }
$('btnGyro').addEventListener('click', async () => {
  if (gyro){ gyro = false; $('btnGyro').classList.remove('on'); removeEventListener('deviceorientation', onTilt); big('体感关了', '用手指拖动'); return; }
  try {
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function'){ const r = await DeviceOrientationEvent.requestPermission(); if (r !== 'granted'){ big('没有权限', '用手指拖动'); return; } }
    if (!('DeviceOrientationEvent' in window)){ big('这台设备不支持', '用手指拖动'); return; }
    gyro = true; $('btnGyro').classList.add('on'); addEventListener('deviceorientation', onTilt); big('体感开了', '走路时歪手机控制托盘');
  } catch (e){ big('体感用不了', '用手指拖动'); }
});

/* ================= 声音 ================= */
const Sound = (() => {
  let ac = null, out, nb;
  const A = {on: store.get('sound', true) !== false};
  A.unlock = () => { if (ac){ if (ac.state === 'suspended') ac.resume(); return; } try { ac = new (window.AudioContext || window.webkitAudioContext)(); out = ac.createGain(); out.gain.value = A.on ? .8 : 0; out.connect(ac.destination); nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } catch (e){} };
  const tone = (f, d = .3, g = .12, type = 'sine', t = 0, f2) => { if (!ac || !A.on) return; const t0 = ac.currentTime + t, o = ac.createOscillator(), e = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d); e.gain.setValueAtTime(.0001, t0); e.gain.linearRampToValueAtTime(g, t0 + .004); e.gain.exponentialRampToValueAtTime(.0001, t0 + d); o.connect(e); e.connect(out); o.start(t0); o.stop(t0 + d + .05); };
  const noise = (d, g, f1, f2, type = 'highpass', t = 0) => { if (!ac || !A.on) return; const t0 = ac.currentTime + t, s = ac.createBufferSource(); s.buffer = nb; const f = ac.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f1, t0); f.frequency.exponentialRampToValueAtTime(f2, t0 + d); const e = ac.createGain(); e.gain.setValueAtTime(.0001, t0); e.gain.linearRampToValueAtTime(g, t0 + .004); e.gain.exponentialRampToValueAtTime(.0001, t0 + d); s.connect(f); f.connect(e); e.connect(out); s.start(t0); s.stop(t0 + d + .05); };
  let lastClink = 0;
  A.clink = v => { if (!ac) return; const n = ac.currentTime; if (n - lastClink < .05) return; lastClink = n; const f = 1800 + Math.random() * 1600; tone(f, .18, .05 * v + .02, 'sine'); tone(f * 1.5, .1, .02 * v, 'sine'); };
  A.ding = () => { tone(1568, .5, .06); tone(2093, .35, .03, 'sine', .01); };
  A.tick = () => tone(880, .06, .06, 'triangle');
  A.crash = () => { noise(.45, .5, 1500, 6000); for (let k = 0; k < 8; k++) tone(2500 + Math.random() * 3000, .08, .04, 'sine', .02 + k * .04); };
  A.served = () => [523, 659, 784, 1047].forEach((f, k) => tone(f, .5, .08, 'triangle', k * .08));
  A.whoa = () => { tone(700, .25, .05, 'triangle', 0, 300); };
  A.place = () => { tone(420, .1, .08, 'sine', 0, 300); noise(.06, .08, 900, 400, 'lowpass'); };
  A.go = () => { tone(660, .12, .06, 'triangle'); tone(880, .18, .06, 'triangle', .1); };
  A.slip = () => { tone(1400, .25, .05, 'sawtooth', 0, 700); };
  A.hey = () => { tone(520, .12, .08, 'square', 0, 680); tone(620, .16, .06, 'square', .14, 500); };
  A.bump = () => { noise(.15, .3, 300, 120, 'lowpass'); tone(110, .2, .2); };
  A.over = () => [392, 330, 262].forEach((f, k) => tone(f, .5, .1, 'triangle', k * .2));

  return A;
})();
const buzz = ms => { const ok = navigator.userActivation ? navigator.userActivation.hasBeenActive : true; if (!ok || !navigator.vibrate) return; try { navigator.vibrate(ms); } catch (e){} };

/* ================= 开机 ================= */
$('btnStart').addEventListener('click', start);
$('btnBoard').addEventListener('click', showBoard);
$('bestNote').textContent = store.get('best', 0) ? `最好一班上了 ${store.get('best', 0)} 道菜` : '';
try { await Promise.all([document.fonts.load('40px "Ma Shan Zheng"', '端盘子出菜口红烧肉小笼包糖醋鱼担担面东坡肘烤鸭酒'), document.fonts.load('30px "ZCOOL KuaiLe"', '让一让上菜第桌啪')]); } catch (e){}
layout();
requestAnimationFrame(loop);
if (['localhost', '127.0.0.1'].includes(location.hostname)) window.__d = {get G(){ return G; }, start, step, placeHold, holdPos, dishInfo, levelErr, loadTorque, sag: sagNow, LIP, DISHES, gameOver, shot: () => { draw(performance.now()); return cv.toDataURL('image/jpeg', .8); }};
})();
</script>
