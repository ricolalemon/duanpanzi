<!doctype html>
<html lang="zh-CN">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta charset="utf-8">
<title>端盘子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap">
<style>
/* 老字号酒楼的大堂：木墙、红灯笼、菜牌，正中是出菜口。外观固定，不跟系统深色走 */
:root{
  color-scheme:light;
  --ink:#3b2418;
  --soft:#7a5a46;
  --red:#d2412c;
  --gold:#f2b63c;
  --card:#fff8ec;
  --line:rgba(80,40,20,.16);
  --font-title:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --font-brush:"Ma Shan Zheng","KaiTi",serif;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-num:"Baloo 2","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{overflow:hidden;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;touch-action:none;-webkit-user-select:none;user-select:none;background:#4a2a1a}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}
#cv{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:0;top:0;width:420px;height:740px;transform-origin:0 0;pointer-events:none}
#hud > *{pointer-events:auto}
.bar{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:8px;pointer-events:none}
.bar > *{pointer-events:auto}
.chip{padding:4px 12px;border-radius:999px;background:rgba(255,248,236,.92);box-shadow:0 4px 10px rgba(0,0,0,.2);font-weight:700;font-size:14px;white-space:nowrap}
.chip b{font-family:var(--font-num);font-size:18px}
.hearts{font-size:18px;letter-spacing:1px}
.grow{flex:1}
.rbtn{width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,248,236,.92);box-shadow:0 4px 10px rgba(0,0,0,.2);font-size:15px;display:grid;place-items:center}
.rbtn.on{background:var(--gold)}
.order{position:absolute;left:50%;top:52px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(59,36,24,.82);color:#fff6e6;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none}
.order .slots{display:flex;gap:3px}
.order .slots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.22)}
.order .slots i.on{background:var(--gold)}
.big{position:absolute;left:50%;top:230px;transform:translate(-50%,-50%) scale(.7);opacity:0;transition:all .3s cubic-bezier(.2,.9,.3,1.4);pointer-events:none;text-align:center;white-space:nowrap}
.big.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.big b{display:block;font-family:var(--font-title);font-weight:400;font-size:42px;color:#fff;text-shadow:0 4px 0 rgba(120,40,20,.6),0 0 18px rgba(0,0,0,.3)}
.big span{display:inline-block;margin-top:2px;padding:2px 12px;border-radius:999px;background:rgba(59,36,24,.8);color:#fff6e6;font-size:14px;font-weight:700}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:6px 16px;border-radius:999px;background:rgba(59,36,24,.85);color:#fff6e6;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;transition:opacity .5s}

/* 首页、弹窗 */
#home,#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#home{background:radial-gradient(120% 80% at 50% 0%,#8a4a2a 0%,#5a2e1c 55%,#3a1c10 100%)}
#modal{background:rgba(40,18,8,.5)}
.card{width:min(370px,100%);max-height:calc(100% - 16px);overflow:auto;border-radius:24px;background:var(--card);box-shadow:0 24px 60px rgba(0,0,0,.4);padding:22px 20px 20px;display:flex;flex-direction:column;gap:12px;text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(14px) scale(.95);opacity:0}}
.logo{margin:0;font-family:var(--font-brush);font-weight:400;font-size:66px;line-height:1;color:var(--red);text-shadow:0 3px 0 #fff3dc}
.card h2{margin:0;font-family:var(--font-title);font-weight:400;font-size:30px}
.card p{margin:0}
.card .n{font-family:var(--font-num);font-weight:800;font-size:58px;line-height:1;color:var(--red)}
.card .small{font-size:12px;color:var(--soft)}
.card .dishes{font-size:24px;letter-spacing:2px;line-height:1.4;word-break:break-all}
.card ul{margin:0;padding:0 0 0 1.2em;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:14px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:900;font-size:17px;background:var(--red);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.16),0 8px 18px rgba(160,40,20,.3)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:active{transform:translateY(2px)}
.row{display:flex;gap:8px}
.row > *{flex:1}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="bar">
      <span class="chip hearts" id="hearts">❤️❤️❤️</span>
      <span class="grow"></span>
      <span class="chip">已上菜 <b id="served">0</b></span>
      <button class="rbtn" id="btnGyro" type="button" aria-label="体感操作" title="歪手机控制">📱</button>
      <button class="rbtn" id="btnPause" type="button" aria-label="暂停">❚❚</button>
    </div>
    <div class="order" id="order"><span id="orderT">第 1 桌</span><span class="slots" id="slots"></span></div>
    <div class="big" id="big"><b></b><span></span></div>
    <div class="hint" id="hint">左右拖动手指，托盘跟着歪</div>
  </div>
</div>

<section id="home">
  <div class="card">
    <h1 class="logo">端盘子</h1>
    <p>你是酒楼新来的跑堂，后厨不停往你托盘上放菜</p>
    <ul>
      <li>左右拖动手指让托盘倾斜，保持平衡</li>
      <li>每桌客人要几道菜，凑齐了端稳三秒就算上菜成功</li>
      <li>掉一道菜碎一个盘子，碎三个就下班</li>
      <li>小心别的跑堂撞你，西瓜会滚</li>
    </ul>
    <button class="btn" id="btnStart" type="button">开工</button>
    <button class="btn ghost" id="btnBoard" type="button">🏆 今日排行榜</button>
    <p class="small" id="bestNote"></p>
  </div>
</section>
<div id="modal" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<!--BOARD 五个小游戏共用的每日排行榜（tools/board.html，用 tools/embed-board.mjs 塞进各个游戏）-->
<style>
.mb-wrap{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,25,20,.5);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#33302e;-webkit-user-select:none;user-select:none}
.mb-card{width:min(380px,100%);max-height:calc(100% - 16px);overflow:auto;border-radius:24px;background:#fffaf3;box-shadow:0 24px 60px rgba(40,20,10,.35);padding:22px 18px 18px;display:flex;flex-direction:column;gap:10px;text-align:center;animation:mb-pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes mb-pop{from{transform:translateY(14px) scale(.95);opacity:0}}
.mb-card h2{margin:0;font-family:"ZCOOL KuaiLe","PingFang SC",sans-serif;font-weight:400;font-size:28px;line-height:1.2}
.mb-sub{margin:0;font-size:12px;color:#7a716a}
.mb-tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:#f1e8dc;align-self:center}
.mb-tabs button{border:0;border-radius:999px;padding:6px 14px;background:transparent;font:inherit;font-weight:700;font-size:13px;color:#7a716a;cursor:pointer}
.mb-tabs button.on{background:#fff;color:#33302e;box-shadow:0 2px 6px rgba(60,30,10,.12)}
.mb-mine{margin:0;font-size:14px;font-weight:700;color:#3b9c80;min-height:1.4em}
.mb-list{display:flex;flex-direction:column;gap:6px;min-height:110px;max-height:50vh;overflow:auto;margin:0 -4px;padding:2px 4px;text-align:left}
.mb-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px rgba(60,40,30,.12)}
.mb-row.me{background:#e6f7f1;box-shadow:inset 0 0 0 2px #5fc7a8}
.mb-rk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:"Baloo 2","Noto Sans SC",sans-serif;font-weight:800;font-size:14px;color:#7a716a}
.mb-rk.g1{background:#ffd54f;color:#7a5200}.mb-rk.g2{background:#dfe3e8;color:#4a5560}.mb-rk.g3{background:#f1c39a;color:#7a3f12}
.mb-nm{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-sc{flex:none;max-width:52%;text-align:right;font-size:12px;color:#7a716a;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-sc b{display:block;font-family:"Baloo 2","Noto Sans SC",sans-serif;font-weight:800;font-size:15px;color:#33302e}
.mb-note{margin:0;padding:18px 0;text-align:center;font-size:13px;color:#7a716a}
.mb-row2{display:flex;gap:8px}
.mb-row2 > *{flex:1}
.mb-btn{border:0;border-radius:14px;padding:11px 10px;font:inherit;font-weight:900;font-size:15px;cursor:pointer;background:#fff;color:#33302e;box-shadow:inset 0 0 0 1.5px rgba(60,40,30,.14);-webkit-tap-highlight-color:transparent}
.mb-btn.main{background:#5fc7a8;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 8px 18px rgba(40,120,100,.3)}
.mb-btn:active{transform:translateY(2px)}
.mb-input{width:100%;box-sizing:border-box;border:0;border-radius:14px;padding:12px 14px;font:inherit;font-size:17px;font-weight:700;color:#33302e;background:#fff;box-shadow:inset 0 0 0 2px rgba(60,40,30,.14);outline:none;-webkit-user-select:text;user-select:text}
.mb-input:focus{box-shadow:inset 0 0 0 2px #5fc7a8}
.mb-err{min-height:1.2em;margin:0;font-size:12px;color:#ff7a6b}
</style>
<script>
window.MiniBoard = (() => {
'use strict';
// Supabase 项目的地址和公开 key（公开 key 本来就是给网页用的，能读榜、能交成绩，改不了别人的）
const URL0 = 'https://ghjrmmqnajguwkfoplgo.supabase.co', KEY = 'sb_publishable_1YWUN4fZ3c_TjQD9p6Lmlg_K-vDB6y_';
const PREVIEW = !!window.claude || /(^|\.)claude(usercontent)?\.(ai|com)$/.test(location.hostname);
const store = {
  get(k, d){ try { const v = localStorage.getItem('mini:' + k); return v == null ? d : JSON.parse(v); } catch (e){ return d; } },
  set(k, v){ try { localStorage.setItem('mini:' + k, JSON.stringify(v)); } catch (e){} }
};
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
// game：哪个游戏；first：一天只算第一局（否则留当天最好的一局）
let cfg = {game: '', first: false};
const day = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
// 每个人一个只存在自己手机上的编号（交成绩、改名用），和一个公开的短标记（榜上认出自己用）；五个游戏共用一个名字
function me(){
  let m = store.get('me', null);
  if (!m){
    const hex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');
    const h = hex(16);
    m = {pid: `${h.slice(0, 8)}-${h.slice(8, 12)}-4${h.slice(13, 16)}-a${h.slice(17, 20)}-${h.slice(20, 32)}`, tag: hex(4), name: ''};
    store.set('me', m);
  }
  return m;
}
let api = async (path, body) => {
  const headers = {apikey: KEY, 'Content-Type': 'application/json'};
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(URL0 + '/rest/v1/' + path, body ? {method: 'POST', headers, body: JSON.stringify(body), signal: ctl.signal} : {headers, signal: ctl.signal});
    if (!r.ok) throw new Error('http ' + r.status);
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  } finally {
    clearTimeout(timer);
  }
};
const pendKey = board => `pend:${cfg.game}:${board}`, sentKey = board => `sent:${cfg.game}:${board}`;
const better = (x, y) => x.a > y.a || (x.a === y.a && (x.b || 0) > (y.b || 0));
// 交成绩：a 越大越好，a 一样比 b；shown 是榜上显示的成绩，extra 是下面一行小字
function submit(board, sc){
  const d = day(), p = store.get(pendKey(board), null), sent = store.get(sentKey(board), null);
  if (cfg.first && ((sent && sent.day === d) || (p && p.day === d))) return;
  if (p && p.day === d && !better(sc, p)) return;
  if (sent && sent.day === d && !better(sc, sent)) return;
  store.set(pendKey(board), {day: d, a: sc.a, b: sc.b || 0, shown: String(sc.shown).slice(0, 40), extra: String(sc.extra || '').slice(0, 60)});
  flush(board).catch(() => {});
}
async function flush(board){
  const p = store.get(pendKey(board), null), m = me();
  if (!p || !m.name || PREVIEW) return null;
  const res = await api('rpc/mini_submit', {p_game: cfg.game, p_board: board, p_day: p.day, p_player: m.pid, p_tag: m.tag, p_name: m.name, p_a: p.a, p_b: p.b, p_shown: p.shown, p_extra: p.extra});
  store.set(pendKey(board), null);
  store.set(sentKey(board), {day: p.day, a: p.a, b: p.b});
  return res;
}
const open = card => { close(); const w = el('div', 'mb-wrap'); w.id = 'mbWrap'; w.appendChild(card); w.addEventListener('click', e => { if (e.target === w) close(); }); document.body.appendChild(w); };
const close = () => { const w = document.getElementById('mbWrap'); if (w) w.remove(); };
// 打开今天的排行榜。o: {title, sub, empty, tabs: [{id, label}]}（有好几张榜的时候上面放一排切换）
async function show(board = '', o = {}){
  const card = el('div', 'mb-card');
  const mine = el('p', 'mb-mine'), list = el('div', 'mb-list');
  card.append(el('h2', '', o.title || '今天的排行榜'), el('p', 'mb-sub', o.sub || ''));
  if (o.tabs){
    const tabs = el('div', 'mb-tabs');
    for (const t of o.tabs){
      const b = el('button', t.id === board ? 'on' : '', t.label);
      b.type = 'button';
      b.addEventListener('click', () => { if (t.id !== board) show(t.id, o); });
      tabs.appendChild(b);
    }
    card.appendChild(tabs);
  }
  card.append(mine, list);
  list.appendChild(el('p', 'mb-note', '正在打开排行榜…'));
  const row = el('div', 'mb-row2');
  const nm = el('button', 'mb-btn', me().name ? '改名字' : '起个名字');
  nm.type = 'button';
  nm.addEventListener('click', () => askName(() => show(board, o)));
  const cl = el('button', 'mb-btn main', '关闭');
  cl.type = 'button';
  cl.addEventListener('click', close);
  row.append(nm, cl);
  card.appendChild(row);
  open(card);
  if (PREVIEW){ list.replaceChildren(el('p', 'mb-note', '预览里连不上排行榜，到网页版看')); return; }
  let res = null;
  try { res = await flush(board); } catch (e){}
  let rows;
  try { rows = await api(`mini_scores?select=tag,name,a,b,shown,extra&game=eq.${cfg.game}&board=eq.${encodeURIComponent(board)}&day=eq.${day()}&order=a.desc,b.desc,updated_at.asc&limit=100`); } catch (e){ if (list.isConnected) list.replaceChildren(el('p', 'mb-note', '排行榜没连上，过一会儿再试')); return; }
  if (!list.isConnected) return;
  const m = me();
  list.replaceChildren();
  if (!rows.length) list.appendChild(el('p', 'mb-note', '今天还没有人上榜，来当第一个'));
  let myRank = 0;
  rows.forEach((r, k) => {
    const isMe = r.tag === m.tag;
    if (isMe) myRank = k + 1;
    const d = el('div', 'mb-row' + (isMe ? ' me' : ''));
    const sc = el('span', 'mb-sc');
    sc.append(el('b', '', r.shown), document.createTextNode(r.extra || ''));
    d.append(el('span', 'mb-rk' + (k < 3 ? ' g' + (k + 1) : ''), String(k + 1)), el('span', 'mb-nm', r.name + (isMe ? '（我）' : '')), sc);
    list.appendChild(d);
  });
  const p = store.get(pendKey(board), null);
  if (myRank) mine.textContent = `你排第 ${myRank} 名，一共 ${rows.length}${rows.length >= 100 ? '+' : ''} 人`;
  else if (res && res.rank) mine.textContent = `你排第 ${res.rank} 名，一共 ${res.total} 人`;
  else if (p && p.day === day()) mine.textContent = m.name ? '成绩还没交上去，过一会儿再打开试试' : '起个名字，今天的成绩就能上榜';
  else if ((store.get(sentKey(board), null) || {}).day === day()) mine.textContent = '你在 100 名以外';
  else mine.textContent = o.empty || '玩一局就能上榜';
  if (myRank) setTimeout(() => list.children[myRank - 1]?.scrollIntoView({block: 'nearest'}), 50);
}
function askName(then){
  const card = el('div', 'mb-card');
  const m = me();
  card.append(el('h2', '', m.name ? '改个名字' : '起个名字上榜'), el('p', 'mb-sub', '排行榜上显示这个名字，最多 12 个字，几个小游戏共用'));
  const input = el('input', 'mb-input');
  input.type = 'text';
  input.maxLength = 12;
  input.placeholder = '比如：小游戏大王';
  input.value = m.name || '';
  input.autocomplete = 'nickname';
  input.enterKeyHint = 'done';
  input.setAttribute('aria-label', '昵称');
  const err = el('p', 'mb-err');
  err.setAttribute('role', 'alert');
  card.append(input, err);
  const ok = () => {
    const name = input.value.trim().slice(0, 12);
    if (!name){ err.textContent = '先起个名字'; input.focus(); return; }
    const renamed = m.name && m.name !== name;
    store.set('me', Object.assign(me(), {name}));
    if (renamed && !PREVIEW) api('rpc/mini_rename', {p_player: m.pid, p_name: name}).catch(() => {});
    then();
  };
  // 回车只算一次：不拦住的话，这一下还会按到下一个弹窗里的按钮
  input.addEventListener('keydown', e => { e.stopPropagation(); if (e.key !== 'Enter' || e.isComposing) return; e.preventDefault(); ok(); });
  const row = el('div', 'mb-row2');
  const skip = el('button', 'mb-btn', m.name ? '不改了' : '先不上榜');
  skip.type = 'button';
  skip.addEventListener('click', m.name ? then : close);
  const go = el('button', 'mb-btn main', '好了');
  go.type = 'button';
  go.addEventListener('click', ok);
  row.append(skip, go);
  card.appendChild(row);
  open(card);
  // 改名的时候旧名字整个选中，直接打字就替换掉
  setTimeout(() => { input.focus(); input.select(); }, 60);
}
const api0 = {init(o){ cfg = Object.assign({first: false}, o); }, submit, show, close, hasName: () => !!me().name};
if (['localhost', '127.0.0.1'].includes(location.hostname)) api0.mock = fn => { api = fn; };
return api0;
})();
</script>

<script>
(async () => {
'use strict';
MiniBoard.init({game: 'duanpanzi'});
const {Engine, Bodies, Body, Composite, Constraint, Events, Vertices} = Matter;
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k, d){ try { const v = localStorage.getItem('dpz:' + k); return v == null ? d : JSON.parse(v); } catch (e){ return d; } },
  set(k, v){ try { localStorage.setItem('dpz:' + k, JSON.stringify(v)); } catch (e){} }
};
const W = 420, H = 740, TRAY = {x: 210, y: 500, w: 250}, FLOOR = 712;

const POOL = [['noodle', 1], ['dumpling', 1], ['teapot', 1], ['steamer', 1], ['bun', 1], ['rice', 1], ['mooncake', 1], ['fish', .8], ['duck', .8], ['jar', .7], ['chop', .5], ['melon', .45]];

/* ================= 物理 ================= */
let engine, tray, pivot, items = new Set(), G = null;
function newWorld(){
  engine = Engine.create();
  engine.gravity.y = 1;
  engine.positionIterations = 10;
  engine.velocityIterations = 8;
  const base = Bodies.rectangle(TRAY.x, TRAY.y, TRAY.w, 12, {chamfer: {radius: 5}});
  const lipL = Bodies.rectangle(TRAY.x - TRAY.w / 2 + 3, TRAY.y - 8, 6, 8, {chamfer: {radius: 2}});
  const lipR = Bodies.rectangle(TRAY.x + TRAY.w / 2 - 3, TRAY.y - 8, 6, 8, {chamfer: {radius: 2}});
  tray = Body.create({parts: [base, lipL, lipR], friction: .35, frictionStatic: .5, label: 'tray'});
  Body.setDensity(tray, .02);
  pivot = Constraint.create({pointA: {x: TRAY.x, y: TRAY.y}, bodyB: tray, pointB: {x: 0, y: 0}, stiffness: 1, length: 0});
  Composite.add(engine.world, [tray, pivot]);
  items = new Set();
  Events.on(engine, 'collisionStart', e => {
    for (const p of e.pairs){
      const v = Math.hypot(p.bodyA.velocity.x - p.bodyB.velocity.x, p.bodyA.velocity.y - p.bodyB.velocity.y);
      if (v > 1.6) Sound.clink(Math.min(1, v / 8));
    }
  });
}
function addDish(type, x, y){
  const d = DISHES[type];
  const opts = {friction: d.friction ?? .28, frictionStatic: .45, restitution: .06, frictionAir: .004};
  let b, off = {x: 0, y: 0};
  if (d.circle) b = Bodies.circle(x, y, d.circle, opts);
  else if (d.rect) b = Bodies.rectangle(x, y, d.rect[0], d.rect[1], {...opts, chamfer: {radius: 4}});
  else {
    const vs = d.verts.map(([px, py]) => ({x: px, y: py}));
    off = Vertices.centre(vs);
    b = Bodies.fromVertices(x, y, [vs], opts);
  }
  Body.setDensity(b, d.density);
  b.dish = type; b.off = off; b.born = G.t; b.calm = 0; b.counted = false;
  Composite.add(engine.world, b);
  items.add(b);
  return b;
}

/* ================= 一局 ================= */
const STEP = 1 / 60;
function start(){
  newWorld();
  G = {t: 0, hearts: 3, served: 0, table: 1, need: 4, onTray: 0, holdT: 0, holding: false, nextDish: 1.2, pending: null, angle: 0, target: 0, bump: null, nextBump: 22, over: false, paused: false, delivering: [], shards: [], fx: [], kept: [], face: 'happy', sweat: 0};
  $('home').hidden = true;
  closeModal();
  hud();
  big('第 1 桌', `客人要 ${G.need} 道菜`);
  $('hint').style.opacity = 1;
  Sound.unlock();
}
function pickDish(){
  const pool = POOL.filter(([id]) => !(G.table < 3 && (id === 'melon' || id === 'chop' || id === 'jar')));
  const tot = pool.reduce((a, [, w]) => a + w, 0);
  let r = Math.random() * tot;
  for (const [id, w] of pool){ if ((r -= w) < 0) return id; }
  return pool[0][0];
}
function stackTop(){ let top = TRAY.y; for (const b of items) if (!b.flying && b.bounds.min.y < top && b.position.y < TRAY.y + 20) top = b.bounds.min.y; return top; }
function step(){
  G.t += STEP;
  // 托盘跟着手：设角速度往目标角度转
  const bumping = G.bump && G.bump.active > 0;
  if (bumping){ G.bump.active -= STEP; }
  else Body.setAngularVelocity(tray, clamp((G.target - tray.angle) * .22, -.045, .045));
  if (Math.abs(tray.angle) > .55) Body.setAngle(tray, clamp(tray.angle, -.55, .55));
  // 后厨上菜：先在出菜口亮一下，再放下来
  if (!G.holding && G.onTray < G.need){
    if (!G.pending && G.t >= G.nextDish){
      const type = pickDish(), x = TRAY.x + (Math.random() - .5) * 150;
      G.pending = {type, x, y: Math.max(214, stackTop() - 110), t0: G.t};
      Sound.ding();
    }
    if (G.pending && G.t - G.pending.t0 > .55){
      addDish(G.pending.type, G.pending.x, G.pending.y);
      G.pending = null;
      G.nextDish = G.t + Math.max(1.4, 3.1 - G.table * .18);
    }
  }
  // 撞一下
  if (G.t > G.nextBump && !G.bump){ G.bump = {dir: Math.random() < .5 ? -1 : 1, t0: G.t, hit: false, active: 0}; Sound.hey(); }
  if (G.bump && !G.bump.hit && G.t - G.bump.t0 > 1.3){
    G.bump.hit = true; G.bump.active = .22;
    Body.setAngularVelocity(tray, G.bump.dir * (.07 + Math.min(.05, G.table * .006)));
    for (const b of items) Body.setVelocity(b, {x: b.velocity.x + G.bump.dir * 1.2, y: b.velocity.y - .6});
    Sound.bump();
    buzz(30);
  }
  if (G.bump && G.t - G.bump.t0 > 2.4){ G.bump = null; G.nextBump = G.t + Math.max(9, 20 - G.table * 1.2) + Math.random() * 6; }
  Engine.update(engine, STEP * 1000);
  // 数一数托盘上稳稳待着的菜，掉地上的摔碎
  let on = 0, edge = false;
  for (const b of [...items]){
    if (b.flying) continue;
    if (b.position.y > FLOOR){ crash(b); continue; }
    const rel = rotate(b.position.x - TRAY.x, b.position.y - TRAY.y, -tray.angle);
    const above = rel.y < 10 && Math.abs(rel.x) < TRAY.w / 2 + 10;
    if (above && b.speed < .4) b.calm += STEP; else b.calm = 0;
    if (above && b.calm > .5) on++;
    if (above && Math.abs(rel.x) > TRAY.w / 2 - 28) edge = true;
  }
  G.onTray = on;
  G.sweat = edge ? Math.min(1, G.sweat + STEP * 3) : Math.max(0, G.sweat - STEP * 2);
  // 凑齐了就要端稳三秒
  if (on >= G.need && !G.pending){
    if (!G.holding){ G.holding = true; G.holdT = 0; Sound.tick(); }
    G.holdT += STEP;
    if (Math.floor(G.holdT) !== Math.floor(G.holdT - STEP) && G.holdT < 3) Sound.tick();
    if (G.holdT >= 3) deliver();
  } else if (G.holding){ G.holding = false; G.holdT = 0; }
  G.face = G.hearts <= 0 ? 'dizzy' : G.sweat > .4 || Math.abs(tray.angle) > .3 ? 'worried' : G.holding ? 'proud' : 'happy';
}
const rotate = (x, y, a) => ({x: x * Math.cos(a) - y * Math.sin(a), y: x * Math.sin(a) + y * Math.cos(a)});
function crash(b){
  items.delete(b);
  Composite.remove(engine.world, b);
  G.hearts--;
  G.holding = false; G.holdT = 0;
  for (let k = 0; k < 16; k++) G.shards.push({x: b.position.x, y: FLOOR, vx: (Math.random() - .5) * 260, vy: -80 - Math.random() * 200, r: Math.random() * TAU, vr: (Math.random() - .5) * 14, life: 1.2, s: 3 + Math.random() * 5, c: Math.random() < .5 ? '#ffffff' : '#9fb6d8'});
  Sound.crash();
  buzz([40, 30, 60]);
  big('啪！', `${DISHES[b.dish].name}摔了`);
  hud();
  if (G.hearts <= 0) setTimeout(gameOver, 900);
}
function deliver(){
  G.holding = false;
  const list = [...items].filter(b => !b.flying);
  G.served += list.length;
  for (const b of list){ b.flying = true; Body.setStatic(b, true); G.delivering.push({b, t0: G.t, x0: b.position.x, y0: b.position.y}); G.kept.push(DISHES[b.dish].emoji); }
  for (let k = 0; k < 40; k++) G.fx.push({x: TRAY.x + (Math.random() - .5) * 200, y: TRAY.y - 40 - Math.random() * 80, vx: (Math.random() - .5) * 200, vy: -100 - Math.random() * 160, life: 1.2, c: ['#f2b63c', '#d2412c', '#ffffff', '#3fae8c'][k % 4], r: Math.random() * TAU});
  Sound.served();
  big('上菜！', `第 ${G.table} 桌 · ${list.length} 道`);
  G.table++;
  G.need = Math.min(12, 3 + G.table);
  G.nextDish = G.t + 2.2;
  setTimeout(() => { if (G && !G.over) big(`第 ${G.table} 桌`, `客人要 ${G.need} 道菜`); }, 1400);
  hud();
}
function gameOver(){
  if (G.over) return;
  G.over = true;
  Sound.over();
  const best = store.get('best', 0), isNew = G.served > best;
  if (isNew) store.set('best', G.served);
  // 排行榜：今天上菜最多的一班，一样多比服务了几桌
  if (G.served > 0) MiniBoard.submit('', {a: G.served, b: G.table - 1, shown: `${G.served} 道菜`, extra: `服务了 ${G.table - 1} 桌`});
  const card = el('div', 'card');
  card.append(el('h2', '', isNew ? '新纪录！' : '下班了'));
  const n = el('div', 'n', String(G.served));
  card.append(n, el('p', 'small', `一共上了 ${G.served} 道菜，服务了 ${G.table - 1} 桌客人 · 最好 ${Math.max(best, G.served)} 道`));
  if (G.kept.length) card.appendChild(el('div', 'dishes', G.kept.slice(-30).join('')));
  const row = el('div', 'row');
  const again = el('button', 'btn', '再来一班'); again.type = 'button'; again.addEventListener('click', start);
  const share = el('button', 'btn ghost', '复制成绩'); share.type = 'button';
  share.addEventListener('click', () => copy(`端盘子：一班上了 ${G.served} 道菜 ${G.kept.slice(-10).join('')}`));
  row.append(again, share);
  card.appendChild(row);
  const lb = el('button', 'btn ghost', '🏆 今日排行榜'); lb.type = 'button'; lb.addEventListener('click', showBoard);
  card.appendChild(lb);
  openModal(card);
}
const showBoard = () => MiniBoard.show('', {title: '今日排行榜', sub: '今天上菜最多的一班，每人留最好的一次', empty: '端一班就能上榜'});

/* ================= 画面 ================= */
const cv = $('cv'), ctx = cv.getContext('2d');
let S = 1, SCALE = 1, bg = null;
function layout(){
  SCALE = Math.min(innerWidth / W, innerHeight / H);
  const d = Math.min(devicePixelRatio || 1, 2.5);
  S = SCALE * d;
  const st = $('stage');
  st.style.width = W * SCALE + 'px'; st.style.height = H * SCALE + 'px';
  cv.width = Math.round(W * S); cv.height = Math.round(H * S);
  $('hud').style.transform = `scale(${SCALE})`;
  drawBg();
}
addEventListener('resize', layout);
function drawBg(){
  bg = document.createElement('canvas');
  bg.width = cv.width; bg.height = cv.height;
  const c = bg.getContext('2d');
  c.scale(S, S);
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#7a3e22'); g.addColorStop(.55, '#a8643a'); g.addColorStop(1, '#6a341c');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // 木墙板
  for (let x = 0; x < W; x += 52){ c.fillStyle = 'rgba(0,0,0,.08)'; c.fillRect(x, 0, 2, FLOOR); c.fillStyle = 'rgba(255,220,180,.05)'; c.fillRect(x + 2, 0, 3, FLOOR); }
  c.fillStyle = '#5a2c16'; c.fillRect(0, 300, W, 10); c.fillStyle = 'rgba(255,220,180,.12)'; c.fillRect(0, 300, W, 2);
  // 出菜口
  const KY = 112;
  c.fillStyle = '#3a1c10'; c.beginPath(); c.roundRect(110, KY, 200, 70, [10, 10, 0, 0]); c.fill();
  const gk = c.createLinearGradient(0, KY + 4, 0, KY + 70); gk.addColorStop(0, '#ffcf80'); gk.addColorStop(1, '#c87a3a');
  c.fillStyle = gk; c.beginPath(); c.roundRect(118, KY + 8, 184, 62, [8, 8, 0, 0]); c.fill();

function drawWaiter(c){

function draw(now){

function updateFx(dt){

/* ================= 操作 ================= */
// 手指在屏幕左右的位置决定托盘歪多少；松手就停在那里
let touching = false, gyro = false;

cv.addEventListener('pointercancel', () => { touching = false; });

/* ================= 声音 ================= */
const Sound = (() => {
